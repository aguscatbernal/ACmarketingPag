<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="robots" content="index, follow" />

    <!-- Vista previa al compartir el link (WhatsApp, Instagram, Google...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AceMedia Marketing" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />

    <meta property="og:locale:alternate" content="en_GB" />

    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />
    <meta name="theme-color" content="#006b5e" />
    <link rel="icon" type="image/png" href="/brand/favicon-64.png" />
